[project]
name = "kraft"
version = "0.0.1"
description = "Lightweight skill generation and verification engine, built on chak-ai."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "zhixiangxue" }]
dependencies = [
    "chakpy>=0.3",
    "pydantic>=2",
    "python-dotenv>=1.2.2",
    "python-frontmatter>=1",
]

[project.optional-dependencies]
# Pulled in only when running examples/ scripts (e.g. `uv sync --extra examples`).
# Kept out of core deps so library users aren't forced to install rich just to
# call kraft() — the library itself does no terminal-pretty-printing.
examples = [
    "rich>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kraft"]

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"

[tool.uv.sources]
chakpy = { path = "../chak-ai", editable = true }
